name: Nightly rebuild from public sources

# Rebuilds the whole site from FedRAMP, the DoD Cyber Exchange and GSA every night,
# verifies it, and commits it. Amplify redeploys on the commit. If a source can't be
# read, the previous good data is kept and the build continues. If page generation
# or verification fails, nothing is committed and GitHub emails the repo owner.

on:
  schedule:
    - cron: '30 9 * * *'     # 09:30 UTC daily, after FedRAMP's 2–4 AM ET uploads
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the image library (for the share image)
        run: python3 -m pip install --quiet pillow

      - name: Refresh FedRAMP, DoD and OneGov data (keeps last good copy on failure)
        continue-on-error: true
        run: python3 src/build_snapshot.py --refresh

      - name: Refresh the FedRAMP changelog (keeps last good copy on failure)
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/FedRAMP/marketplace-fedramp-gov-data/main/fedramp-status-changelog.json -o /tmp/changelog.json
          python3 -c "import json; json.load(open('/tmp/changelog.json'))"
          cp /tmp/changelog.json src/data/changelog.json

      - name: Generate the site
        run: python3 src/build.py

      - name: Verify links, titles, canonicals
        run: |
          python3 src/verify.py | tee /tmp/verify.txt
          if grep -q "broken link" /tmp/verify.txt; then echo "Broken links found; not publishing."; exit 1; fi

      - name: Write the newsletter draft (drafts/latest.html, last 14 days)
        continue-on-error: true
        run: |
          python3 src/weekly_draft.py --days 14
          cp "drafts/$(date -u +%Y-%m-%d).html" drafts/latest.html
          cp "drafts/$(date -u +%Y-%m-%d).md" drafts/latest.md
          ls drafts | grep -E '^(changelog-)?[0-9]{4}-' | sort | head -n -90 | sed 's#^#drafts/#' | xargs -r rm -f   # keep about a month

      - name: Publish generated pages to the repo root (what Amplify serves)
        run: |
          find . -maxdepth 1 -mindepth 1 ! -name src ! -name .github ! -name dist ! -name README.md ! -name HANDOFF.md ! -name drafts ! -name .git ! -name .gitignore ! -name amplify.yml -exec rm -rf {} +
          cp -r dist/. .
          rm -rf dist

      - name: Commit if anything changed
        run: |
          git config user.name "fedcatalog-bot"
          git config user.email "fedcatalog-bot@users.noreply.github.com"
          # If anything was pushed to the repo while this ran, keep those source edits.
          git fetch origin main
          git checkout origin/main -- src .github README.md HANDOFF.md 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then echo "No changes tonight."; exit 0; fi
          git commit -m "Nightly rebuild $(date -u +%Y-%m-%d)"
          # Put tonight's commit on top of whatever is now on main, then push.
          git pull --rebase origin main || { git rebase --abort; echo "Could not reconcile with new commits on main; will try again tomorrow."; exit 1; }
          git push origin HEAD:main
